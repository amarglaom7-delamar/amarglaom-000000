kind = "mobile"
previewPath = "/mini-wave-browser/"
title = "MiniWave Browser"
description = "A lightweight Android browser evolved from the existing UC Mini Arabic app, with real in-app browsing, tabs, local history and bookmarks, private mode, downloads, QR scanning, media controls, and Arabic/English RTL support."
version = "1.0.0"
id = "artifacts/mini-wave-browser"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/mini-wave-browser/" ]
localPort = 25099

[services.development]
run = "pnpm --filter @workspace/mini-wave-browser run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mini-wave-browser", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/mini-wave-browser", "run", "serve" ]

[services.env]
PORT = "25099"
BASE_PATH = "/mini-wave-browser/"
