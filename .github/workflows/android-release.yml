name: Android Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build installable Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply video control UI patch
        run: node scripts/patch-video-controls.js

      - name: Harden in-video controls overlay
        run: node scripts/patch-video-controls-v2.js

      - name: Apply in-video subtitle patch
        run: node scripts/patch-video-subtitles.js

      - name: Apply UC Mini 2022-inspired video tools
        run: node scripts/apply-uc-mini-2022-tools.js

      - name: Validate TypeScript
        run: pnpm run typecheck

      - name: Generate Android native project
        env:
          CI: '1'
        run: pnpm exec expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Verify APK output
        run: |
          test -s android/app/build/outputs/apk/release/app-release.apk
          file android/app/build/outputs/apk/release/app-release.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: mini-wave-browser-android-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
